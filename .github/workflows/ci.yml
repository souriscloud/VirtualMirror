name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VirtualMirror.xcodeproj -scheme VirtualMirror

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project VirtualMirror.xcodeproj \
            -scheme VirtualMirror \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild test \
              -project VirtualMirror.xcodeproj \
              -scheme VirtualMirror \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO

  appcast:
    name: Appcast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check appcast URLs point at their own release tags
        run: python3 scripts/appcast-tool.py check appcast.xml "$GITHUB_REPOSITORY"

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
